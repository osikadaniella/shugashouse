<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171715"><title>Customer Login | ShugasHouse</title><link rel="stylesheet" href="assets/css/style.css">
<style>
.auth-wrap{min-height:75vh;display:grid;place-items:center;background:#f7f5f0;padding:40px 18px}.auth-card{background:white;padding:42px;width:min(440px,100%);box-shadow:0 12px 50px #0000000a}.auth-card h1{font:500 36px "Playfair Display",serif;margin:0 0 10px}.auth-card p{color:#777;line-height:1.7;font-size:12px}.auth-card label{display:block;font-size:10px;font-weight:700;margin:18px 0 7px}.auth-card input{width:100%;padding:13px;border:1px solid #e3dfd6;outline-color:#b99a5b}.auth-card button{width:100%;margin-top:24px;border:0;cursor:pointer}.auth-message{min-height:18px;color:#9b513e!important}.auth-message.success{color:#47734d!important}.auth-card button:disabled{opacity:.65;cursor:wait}
</style></head><body><div class="announcement">WELCOME TO SHUGASHOUSE</div>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">S<span>H</span></span><span class="brand-name">SHUGAS<span>HOUSE</span></span></a><a class="text-link" href="index.html">Back to store ↗</a></header>
<main class="auth-wrap"><section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to your account.</h1><p>Access your ShugasHouse account, orders and saved details.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required><button id="submitButton" class="button button-gold" type="submit">Sign in <span>↗</span></button></form>
<p class="auth-message" id="message" role="status" aria-live="polite"></p><p>New to ShugasHouse? <a href="register.html" style="color:#9b8150">Create an account</a></p></section></main>
<footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">S<span>H</span></span><span class="brand-name">SHUGAS<span>HOUSE</span></span></a><small>© ShugasHouse. All rights reserved.</small></footer>
<script>
const form=document.getElementById("loginForm"), message=document.getElementById("message"), button=document.getElementById("submitButton");
form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="Signing you in…";message.className="auth-message";button.disabled=true;
try{const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:form.email.value,password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to sign in.");message.textContent="Signed in successfully. Taking you to your account…";message.classList.add("success");window.location.href="account.html";}
catch(error){message.textContent=error.message||"Something went wrong. Please try again.";}finally{button.disabled=false;}});
</script></body></html>
