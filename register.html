<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171715"><title>Create Account | ShugasHouse</title><link rel="stylesheet" href="assets/css/style.css">
<style>
.auth-wrap{min-height:75vh;display:grid;place-items:center;background:#f7f5f0;padding:40px 18px}.auth-card{background:white;padding:42px;width:min(440px,100%);box-shadow:0 12px 50px #0000000a}.auth-card h1{font:500 36px "Playfair Display",serif;margin:0 0 10px}.auth-card p{color:#777;line-height:1.7;font-size:12px}.auth-card label{display:block;font-size:10px;font-weight:700;margin:15px 0 7px}.auth-card input{width:100%;padding:13px;border:1px solid #e3dfd6;outline-color:#b99a5b}.auth-card button{width:100%;margin-top:24px;border:0;cursor:pointer}.auth-message{min-height:18px;color:#9b513e!important}.auth-message.success{color:#47734d!important}.auth-card button:disabled{opacity:.65;cursor:wait}.hint{font-size:10px!important;color:#999!important}
</style></head><body><div class="announcement">WELCOME TO SHUGASHOUSE</div>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">S<span>H</span></span><span class="brand-name">SHUGAS<span>HOUSE</span></span></a><a class="text-link" href="index.html">Back to store ↗</a></header>
<main class="auth-wrap"><section class="auth-card"><p class="eyebrow">JOIN THE HOUSE</p><h1>Create your account.</h1><p>Set up your personal ShugasHouse shopping account.</p>
<form id="registerForm"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" placeholder="Your full name" maxlength="100" required><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required><label for="password">Create password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="At least 10 characters" required><p class="hint">Use at least 10 characters. Choose a password you don't use elsewhere.</p><button id="submitButton" class="button button-gold" type="submit">Create account <span>↗</span></button></form>
<p class="auth-message" id="message" role="status" aria-live="polite"></p><p>Already have an account? <a href="login.html" style="color:#9b8150">Sign in</a></p></section></main>
<footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">S<span>H</span></span><span class="brand-name">SHUGAS<span>HOUSE</span></span></a><small>© ShugasHouse. All rights reserved.</small></footer>
<script>
const form=document.getElementById("registerForm"),message=document.getElementById("message"),button=document.getElementById("submitButton");
form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="Creating your account…";message.className="auth-message";button.disabled=true;
try{const response=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({fullName:form.fullName.value,email:form.email.value,password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to create account.");message.textContent="Your account is ready. Taking you to your account…";message.classList.add("success");window.location.href="account.html";}
catch(error){message.textContent=error.message||"Something went wrong. Please try again.";}finally{button.disabled=false;}});
</script></body></html>
